name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  testes:
    name: Testes (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:teste@localhost:5432/teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov-report=xml

  infra:
    name: Infra (imagem, compose, Kong, Prometheus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t revenda-api:ci .
      - name: Valida docker-compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Valida configuração do Kong
        run: docker run --rm -v "$PWD/infra/kong:/kong" -e KONG_DATABASE=off kong:3.9 kong config parse /kong/kong.yml
      - name: Valida Prometheus e regras de alerta
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
      - name: Valida JSON do painel do Grafana
        run: python -m json.tool infra/grafana/dashboards/revenda.json > /dev/null
