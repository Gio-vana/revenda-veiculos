groups:
  - name: revenda
    rules:
      - alert: ServicoFora
        expr: up == 0
        for: 1m
        labels: { severidade: critica }
        annotations:
          resumo: "{{ $labels.job }} não responde há mais de 1 minuto"

      - alert: TaxaDeErros5xxAlta
        expr: |
          sum by (job) (rate(http_requests_total{status="5xx"}[5m]))
            / sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severidade: alta }
        annotations:
          resumo: "Mais de 5% das requisições de {{ $labels.job }} com erro 5xx"

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severidade: media }
        annotations:
          resumo: "p95 de latência de {{ $labels.job }} acima de 1s"

      - alert: MuitasRequisicoesBarradasNoGateway
        expr: sum(rate(kong_http_requests_total{code="429"}[5m])) > 1
        for: 5m
        labels: { severidade: media }
        annotations:
          resumo: "Rate limiting do Kong barrando mais de 1 req/s"
