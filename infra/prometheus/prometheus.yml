global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: revenda-api
    static_configs:
      - targets: ["revenda-api:8000"]

  - job_name: identidade-api
    static_configs:
      - targets: ["identidade-api:8000"]

  - job_name: kong
    static_configs:
      - targets: ["kong:8100"]
